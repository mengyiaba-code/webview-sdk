<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Payment</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
        .card { background: #ffffff; border-radius: 20px; padding: 24px; width: 100%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
        .amount { font-size: 32px; font-weight: 800; color: #1d1b20; margin: 8px 0; }
        .id-tag { background: #e8def8; color: #6750a4; padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 12px; font-family: monospace; }
        .qr-box { margin: 20px 0; padding: 12px; background: #fff; border: 1px solid #e0e0e0; border-radius: 16px; display: inline-block; }
        .qr-box img { width: 180px; height: 180px; display: block; }
        .status { font-size: 14px; font-weight: 600; color: #0277bd; }
        .paid-box { display: none; background: #e8f5e9; border: 1px solid #c8e6c9; color: #1b5e20; padding: 20px; border-radius: 16px; font-weight: bold; font-size: 18px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <span id="orderIdTag" class="id-tag">ORDER #---</span>
        <div style="color:#666; font-size:13px; margin-top:10px;">Scan QR to Pay</div>
        <div id="amountDisplay" class="amount">$0.00</div>

        <div id="qrContainer" class="qr-box">
            <img id="qrImage" src="" alt="Loading QR..." />
        </div>

        <div id="statusText" class="status">⏳ Waiting for scan...</div>
        <div id="paidBox" class="paid-box">✅ Payment Successful!</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id') || 'UNKNOWN';
        const amount = urlParams.get('amount') || '$0.00';
        const workerUrl = urlParams.get('workerUrl') || '';

        document.getElementById('orderIdTag').textContent = 'ORDER #' + orderId;
        document.getElementById('amountDisplay').textContent = amount;

        if (workerUrl) {
            // 1. Generate QR Code pointing to your Cloudflare Worker checkout page
            const payTargetUrl = `${workerUrl}/pay?id=${encodeURIComponent(orderId)}&amount=${encodeURIComponent(amount)}`;
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(payTargetUrl)}`;
            document.getElementById('qrImage').src = qrApiUrl;

            // 2. Listen for Server-Sent Events (SSE) instead of polling
            // Opens a single, persistent connection to the new /stream endpoint
            const eventSource = new EventSource(`${workerUrl}/stream?id=${encodeURIComponent(orderId)}`);

            // This triggers instantly the moment the server pushes the 'data: ...' string
            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.payload && data.payload.status === 'paid') {
                    // Stop listening
                    eventSource.close(); 

                    // Update UI to Paid state
                    document.getElementById('qrContainer').style.display = 'none';
                    document.getElementById('statusText').style.display = 'none';
                    document.getElementById('paidBox').style.display = 'block';

                    // Notify Android Native SDK
                    if (window.AndroidSDK) {
                        window.AndroidSDK.onPaymentComplete(orderId, amount);
                    }
                }
            };

            // EventSource automatically reconnects on network drops!
            eventSource.onerror = (error) => {
                console.log('SSE connection dropped or timed out. Reconnecting naturally...');
            };
        }
    </script>
</body>
</html>
