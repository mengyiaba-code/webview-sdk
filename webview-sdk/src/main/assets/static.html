<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Payment</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
        .card { background: #ffffff; border-radius: 20px; padding: 24px; width: 100%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
        .amount { font-size: 32px; font-weight: 800; color: #1d1b20; margin: 8px 0; }
        .id-tag { background: #e8def8; color: #6750a4; padding: 4px 12px; border-radius: 12px; font-weight: bold; font-size: 12px; font-family: monospace; display: inline-block; margin-bottom: 16px;}
        
        /* Pending View Styles */
        .qr-box { margin: 10px 0 20px 0; padding: 12px; background: #fff; border: 1px solid #e0e0e0; border-radius: 16px; display: inline-block; transition: opacity 0.3s; }
        .qr-box img { width: 180px; height: 180px; display: block; }
        .status { font-size: 14px; font-weight: 600; color: #0277bd; margin-top: 10px; }
        
        /* Success View Styles */
        .success-view { display: none; padding: 20px 0; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .success-icon { font-size: 72px; margin-bottom: 12px; line-height: 1; }
        .success-title { font-size: 24px; font-weight: 800; color: #1b5e20; }
        .cashier-note { margin-top: 24px; background: #f1f5f9; color: #475569; padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 600; }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="card">
        <span id="orderIdTag" class="id-tag">ORDER #---</span>
        
        <!-- View 1: QR Code & Waiting -->
        <div id="pendingView">
            <div style="color:#666; font-size:13px;">Total Due</div>
            <div id="amountDisplay" class="amount">$0.00</div>

            <div id="qrContainer" class="qr-box">
                <img id="qrImage" src="" alt="Loading QR..." />
            </div>

            <div id="statusText" class="status">⏳ Waiting for customer to scan...</div>
        </div>

        <!-- View 2: Payment Successful -->
        <div id="successView" class="success-view">
            <div class="success-icon">✅</div>
            <div class="success-title">Payment Successful</div>
            <div id="successAmount" class="amount" style="color: #1b5e20;">$0.00</div>
            
            <div class="cashier-note">
                🧑‍💼 Cashier has been notified and the receipt is printing.
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id') || 'UNKNOWN';
        const amount = urlParams.get('amount') || '$0.00';
        const workerUrl = urlParams.get('workerUrl') || '';

        // Set variables in the UI
        document.getElementById('orderIdTag').textContent = 'ORDER #' + orderId;
        document.getElementById('amountDisplay').textContent = amount;
        document.getElementById('successAmount').textContent = amount; // Sets the amount on the success screen

        if (workerUrl) {
            // Generate QR Code
            const payTargetUrl = `${workerUrl}/pay?id=${encodeURIComponent(orderId)}&amount=${encodeURIComponent(amount)}`;
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(payTargetUrl)}`;
            document.getElementById('qrImage').src = qrApiUrl;

            // Connect to Cloudflare Worker stream
            const eventSource = new EventSource(`${workerUrl}/stream?id=${encodeURIComponent(orderId)}`);

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const currentStatus = data.payload ? data.payload.status : null;
                
                if (currentStatus === 'scanned') {
                    // Stage 2: User opened the camera link
                    document.getElementById('qrContainer').style.opacity = '0.15';
                    document.getElementById('statusText').textContent = '📱 Phone connected! Waiting for payment...';
                    document.getElementById('statusText').style.color = '#ef6c00'; // Orange
                } 
                else if (currentStatus === 'paid') {
                    // Stage 3: Payment finished
                    eventSource.close(); 
                    
                    // Hide the pending UI completely
                    document.getElementById('pendingView').style.display = 'none';
                    
                    // Show the Success UI
                    document.getElementById('successView').style.display = 'block';

                    // Notify the native Android app
                    if (window.AndroidSDK) {
                        window.AndroidSDK.onPaymentComplete(orderId, amount);
                    }
                }
            };
        }
    </script>
</body>
</html>
